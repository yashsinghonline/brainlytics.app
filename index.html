<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain Games — Train your brain, one minute at a time</title>
    <meta name="description" content="12 fast brain games for memory, logic, speed, math and focus. Daily challenges, streaks and a brain score that grows with you. Free, works offline, no account needed." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="icons/icon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function(){
        try {
          var s = localStorage.getItem('brain-games:v1');
          var t = 'dark';
          if (s) {
            var p = JSON.parse(s);
            if (p && p.settings && p.settings.theme) t = p.settings.theme;
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = t;
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Top Navigation Header -->
    <header class="top-nav">
      <div class="site-container top-nav-inner">
        <a href="#/" class="brand-logo tap" data-view="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
          <span>Brain Games</span>
        </a>

        <nav class="nav-links">
          <button type="button" class="nav-link active" data-view="home">Home</button>
          <button type="button" class="nav-link" data-view="games">Games</button>
          <button type="button" class="nav-link" data-view="daily">Daily</button>
          <button type="button" class="nav-link" data-view="progress">Progress</button>
          <button type="button" class="nav-link" data-view="profile">Profile</button>
        </nav>

        <div class="nav-actions">
          <div class="stat-pill" title="Brain Score">
            <span class="label">SCORE</span>
            <span class="num font-bold" id="nav-brain-score">0</span>
          </div>
          <div class="stat-pill" title="Current Daily Streak">
            <span class="label">🔥</span>
            <span class="num font-bold" id="nav-streak">0 d</span>
          </div>
          <button type="button" class="icon-btn tap" id="btn-quick-theme" title="Toggle theme">🌓</button>
          <button type="button" class="icon-btn tap" id="btn-quick-sound" title="Toggle sound">🔊</button>
        </div>
      </div>
    </header>

    <!-- Main Content Panels -->
    <main>
      <section id="view-home" class="view-panel active"></section>
      <section id="view-games" class="view-panel"></section>
      <section id="view-daily" class="view-panel"></section>
      <section id="view-progress" class="view-panel"></section>
      <section id="view-profile" class="view-panel"></section>
    </main>

    <!-- Fullscreen Game Modal Stage -->
    <div id="game-stage-overlay" class="game-stage-overlay" style="display: none;"></div>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav">
      <button type="button" class="bottom-tab active tap" data-view="home">
        <span>🏠</span>
        <span>Home</span>
      </button>
      <button type="button" class="bottom-tab tap" data-view="games">
        <span>🎯</span>
        <span>Games</span>
      </button>
      <button type="button" class="bottom-tab tap" data-view="daily">
        <span>⚡</span>
        <span>Daily</span>
      </button>
      <button type="button" class="bottom-tab tap" data-view="progress">
        <span>📈</span>
        <span>Stats</span>
      </button>
      <button type="button" class="bottom-tab tap" data-view="profile">
        <span>👤</span>
        <span>Profile</span>
      </button>
    </nav>

    <!-- Toast alerts -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts (Standalone, pure vanilla browser JS) -->
    <script src="sound.js"></script>
    <script src="storage.js"></script>
    <script src="games.js"></script>
    <script src="app.js"></script>
  </body>
</html>
